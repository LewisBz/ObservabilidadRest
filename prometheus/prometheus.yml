global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    honor_labels: false
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          environment: vps

  - job_name: rest
    honor_labels: false
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/rest.yml
        refresh_interval: 30s
    relabel_configs:
      - target_label: service
        replacement: rest

  - job_name: node-exporter
    honor_labels: false
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          environment: vps

  - job_name: cadvisor
    honor_labels: false
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          environment: vps
