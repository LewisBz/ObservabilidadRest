# File service discovery for the REST Express API on rest-edge.
# Internal port is 3000 (same as /health). Do not use 8080.
- targets:
    - testbackend:3000
  labels:
    environment: develop
    __metrics_path__: /metrics
- targets:
    - prodbackend:3000
  labels:
    environment: production
    __metrics_path__: /metrics
