[snoopy]
error_logging = yes
message_format = "[snoopy] uid:%{uid} user:%{username} sid:%{sid} tty:%{tty} cwd:%{cwd} filename:%{filename} cmdline:%{cmdline}"
filter_chain = exclude_spawns_of:dockerd,docker,containerd,containerd-shim,containerd-shim-runc-v2,runc,grafana,prometheus,loki,alloy,cadvisor,node_exporter,k6
output = logger
